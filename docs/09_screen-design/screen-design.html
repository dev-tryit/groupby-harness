    --text-primary: var(--grey-900); --text-secondary: var(--grey-700); --text-tertiary: var(--grey-600); --text-brand: var(--blue-600);
    --border-secondary: var(--grey-200); --border-focus: var(--blue-500);

    --verdict-similar: #9f5100; --verdict-similar-weak: #ffecd0;
    --verdict-different: #c2152f; --verdict-different-weak: #ffe1e1;
    --radius-m: 12px; --radius-xl: 16px; --radius-3xl: 24px; --radius-full: 999px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px;

  * { box-sizing: border-box; }
  body { margin: 0; padding: calc(var(--top-bar) + var(--space-6)) var(--space-6) 96px; background: var(--fill-secondary); color: var(--text-primary);
         font: 400 15px/1.5 var(--font); letter-spacing: -0.005em; }
  main { max-width: 1120px; margin: 0 auto; }
  h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
  ul { list-style: none; }
  button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
  :focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  .h4 { font: 700 20px/1.35 var(--font); letter-spacing: -0.015em; }
  .title-2 { font: 600 17px/1.45 var(--font); letter-spacing: -0.01em; }

  .body-3 { font: 400 13px/1.5 var(--font); letter-spacing: 0; }
  .label-s { font: 600 13px/1.25 var(--font); letter-spacing: 0; }
  .secondary { color: var(--text-secondary); }
  .tertiary { color: var(--text-tertiary); }
  .tnum { font-feature-settings: "tnum"; }

  .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; height: var(--top-bar); padding: 0 var(--space-6); background: var(--white); border-bottom: 1px solid var(--border-secondary); }
  .top-bar > div { max-width: 1120px; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); }

  .menu { display: flex; gap: var(--space-6); height: 100%; }
  .menu-item { display: flex; align-items: center; height: 100%; font: 600 15px/1.25 var(--font); color: var(--text-tertiary); border-bottom: 2.5px solid transparent; border-top: 2.5px solid transparent; text-decoration: none; white-space: nowrap; }
  .menu-item[aria-current="page"] { color: var(--text-primary); border-bottom-color: var(--fill-brand); }
  .tabs { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .tab { min-height: 34px; padding: var(--space-1) var(--space-4); border-radius: var(--radius-full); background: var(--white); border: 1px solid var(--border-secondary); color: var(--text-secondary);
         font: 600 15px/1.25 var(--font); text-align: left; transition: background var(--dur-fast) var(--ease), color var(--dur-base) var(--ease); max-width: 100%; }
  .tab:hover { background: var(--fill-weak); }
  .tab[aria-selected="true"] { background: var(--fill-primary); border-color: var(--fill-primary); color: var(--white); }

  .hero { padding: var(--space-10) 0 0; }
  .hero > p { margin-top: var(--space-3); max-width: 60ch; }
  .duties { margin-top: var(--space-6); display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); }
  .duties > .label-s { margin-right: var(--space-1); }
  .chip { display: inline-flex; align-items: center; min-height: 34px; padding: var(--space-1) var(--space-4); border-radius: var(--radius-full); background: var(--white); border: 1px solid var(--border-secondary); color: var(--text-secondary); }

  .card { background: var(--white); border-radius: var(--radius-3xl); padding: var(--space-8); }
  .section { margin-top: var(--space-12); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
  .section-note { margin-top: var(--space-3); }

  .button-secondary { display: inline-flex; align-items: center; height: 32px; padding: 0 var(--space-3); border-radius: 10px; background: var(--fill-secondary);
                      font: 600 13px/1.25 var(--font); white-space: nowrap; transition: background var(--dur-fast) var(--ease); }
  .button-secondary:hover, .row-head:hover .button-secondary { background: var(--grey-200); }
  .text-button { font: 600 13px/1.25 var(--font); color: var(--text-brand); padding: var(--space-2) 0; }
  .text-button:hover { text-decoration: underline; }

  .conditions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
  .condition-group { background: var(--white); border-radius: var(--radius-3xl); padding: var(--space-6); }
  .condition-group.excluded { background: transparent; border: 1px solid var(--border-secondary); }
  .condition-group > .head { margin-bottom: var(--space-3); }
  .condition-group > .head .body-3 { display: block; }
  .condition-group li { display: grid; grid-template-columns: 32px minmax(0, 1fr); padding: var(--space-2) 0; }
  .condition-group li.plain { grid-template-columns: minmax(0, 1fr); }
  .no { font: 600 13px/1.75 var(--font); color: var(--text-tertiary); font-feature-settings: "tnum"; }

  .badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 6px; border-radius: 6px; font: 600 13px/1.25 var(--font); white-space: nowrap; }
  .badge-match { color: var(--verdict-match); background: var(--verdict-match-weak); }
  .badge-similar { color: var(--verdict-similar); background: var(--verdict-similar-weak); }
  .badge-different { color: var(--verdict-different); background: var(--verdict-different-weak); }
  .badge-neutral { color: var(--text-secondary); background: var(--fill-secondary); }
  .badge-unverified { color: var(--text-secondary); border: 1px dashed var(--grey-400); }
  .badge .no { font-weight: 500; line-height: 1.25; color: inherit; opacity: 0.8; }

  .legend { margin-bottom: var(--space-3); padding: var(--space-5) var(--space-6); border-radius: var(--radius-xl); }
  .legend li { display: grid; grid-template-columns: 180px minmax(0, 1fr); align-items: center; padding: var(--space-2) 0; }

  .board { display: grid; gap: var(--space-3); }
  .board-row { background: var(--white); border-radius: var(--radius-xl); border: 1.5px solid transparent; transition: border-color var(--dur-base) var(--ease); }

  .row-head { display: grid; grid-template-columns: 32px minmax(120px, 190px) minmax(0, 1fr) 168px auto; align-items: center; gap: var(--space-4);

  .rank { font: 700 20px/1.35 var(--font); font-feature-settings: "tnum"; color: var(--text-tertiary); }

  .verdicts { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); }

  .evidence-body { margin: var(--space-3) 0 0 32px; display: grid; gap: var(--space-2); justify-items: start; }
  .quote-block { width: 100%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-m); background: var(--fill-secondary); border: 1.5px solid transparent;

  .quote-block.plain { color: var(--text-secondary); }
  .quote-hint { display: block; margin-top: var(--space-1); color: var(--text-brand); }
  .reason { padding: var(--space-3) var(--space-4); border-radius: var(--radius-m); border: 1px solid var(--border-secondary); color: var(--text-secondary); }

  .resume-pane { position: sticky; top: calc(var(--top-bar) + var(--space-4)); }

  .quote-highlight { color: var(--text-primary); background-color: transparent; background-repeat: no-repeat; background-size: 100% 100%;

  .hl-match { background-image: linear-gradient(var(--verdict-match-weak), var(--verdict-match-weak)); }
  .hl-similar { background-image: linear-gradient(var(--verdict-similar-weak), var(--verdict-similar-weak)); }
  .hl-different { background-image: linear-gradient(var(--verdict-different-weak), var(--verdict-different-weak)); }

  .state { padding: var(--space-16) var(--space-6); text-align: center; }
  .state p + p, .state p + button { margin-top: var(--space-3); }
  .loader { display: inline-flex; gap: 6px; }
  .loader > span { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--grey-400); }

    .conditions, .detail { grid-template-columns: 1fr; }

    .row-head .score-box { grid-template-columns: auto; }
    .row-head .progress, .row-head .button-secondary { display: none; }
    .detail { padding: var(--space-4); gap: var(--space-8); }
    .resume-pane { position: static; }
    .legend li { grid-template-columns: 1fr; gap: var(--space-1); }

  @media (prefers-reduced-motion: no-preference) {
    .resume { scroll-behavior: smooth; }

    .loader > span { animation: pulse 900ms var(--ease) infinite; }
    .loader > span:nth-child(2) { animation-delay: 150ms; }
    .loader > span:nth-child(3) { animation-delay: 300ms; }
    @keyframes stroke { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  }

  return [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2, '0')).join('');
}
function logFailure(traceId, path, error) {
  console.error(JSON.stringify({ ts: new Date().toISOString(), level: 'ERROR', service: 'frontend', trace_id: traceId, event: 'api.failed', path, error }));
}
async function request(path, preview) {
  const traceId = newTraceId();
  try {
    if (usePreview) {
      if (previewState === 'loading') return new Promise(() => {});
      if (previewState === 'error') throw new Error('preview');
      const value = preview();
      if (value === undefined) throw new Error('not_found');
      return value;
    }
    const response = await fetch(path, { headers: { 'X-Trace-Id': traceId } });
    if (!response.ok) throw new Error('status ' + response.status);
    return await response.json();
  } catch (e) {
    logFailure(traceId, path, e.message);
    throw e;
  }
}
const api = {
  postings: () => request('/api/postings', () => ({ postings: previewState === 'empty' ? [] : PREVIEW.postings })),
  posting: id => request(`/api/postings/${encodeURIComponent(id)}`, () => {
    const p = PREVIEW.posting[id];
    return p && previewState === 'no-resume' ? { ...p, ranking: [] } : p;
  }),
  resumeMatch: rid => request(`/api/resumes/${encodeURIComponent(rid)}`, () => PREVIEW.match[rid]),
};

const SCORED = ['자격요건', '우대사항'];
const BADGE = { '일치': 'badge-match', '비슷': 'badge-similar', '다름': 'badge-different',
                '이력서에 적혀 있지 않음': 'badge-neutral', '근거를 확인하지 못함': 'badge-unverified' };
const SHORT = { '일치': '일치', '비슷': '비슷', '다름': '다름', '이력서에 적혀 있지 않음': '없음', '근거를 확인하지 못함': '미확인' };
const HIGHLIGHT = { '일치': 'hl-match', '비슷': 'hl-similar', '다름': 'hl-different' };
const LEGEND = [['일치', '조건을 그대로 채웠어요. 2점이에요.'], ['비슷', '가깝지만 그대로는 아니에요. 1점이에요.'], ['다름', '채우지 못했어요. 0점이에요.'],
  ['이력서에 적혀 있지 않음', '이력서에서 근거로 낼 구절을 찾지 못했어요. 0점이에요.'],
  ['근거를 확인하지 못함', '근거로 낸 구절이 이력서에 없어서 판정을 믿지 않아요. 0점이에요.']];

const view = { postings: null, current: null, posting: null, opened: null, match: null, picked: null,
               showLegend: false, showCalc: false, showReference: false, reasons: new Set() };

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'on') for (const [e, f] of Object.entries(v)) node.addEventListener(e, f);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c instanceof Node ? c : document.createTextNode(c));
  return node;
}
function pressable(node, fn) {
  node.tabIndex = 0;
  node.setAttribute('role', 'button');
  node.addEventListener('click', fn);
  node.addEventListener('keydown', e => { if (e.target === node && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); fn(); } });
  return node;
}
const toggle = (key, label, hideLabel) => el('button', { class: 'text-button', 'aria-expanded': String(view[key]), on: { click: () => { view[key] = !view[key]; render(); } } }, view[key] ? hideLabel : label);
const badge = (mark, text) => el('span', { class: 'badge ' + BADGE[mark] }, text === undefined ? mark : text);

const loading = () => el('div', { class: 'state', role: 'status', 'aria-label': '불러오는 중' }, el('span', { class: 'loader' }, el('span'), el('span'), el('span')));
const failed = retry => el('div', { class: 'state' }, el('p', { class: 'title-2' }, '불러오지 못했어요'),
  el('p', { class: 'secondary' }, '잠시 뒤에 다시 불러올 수 있어요.'), el('button', { class: 'button-secondary', on: { click: retry } }, '다시 불러오기'));

async function load(key, fetcher, stillWanted) {
  view[key] = 'loading'; render();
  try { const value = await fetcher(); if (stillWanted()) { view[key] = value; render(); } }
  catch (e) { if (stillWanted()) { view[key] = e; render(); } }
}
const loadPostings = () => load('postings', async () => {
  const list = (await api.postings()).postings;
  if (list.length && view.current === null) selectPosting(list[0].posting_id);
  return list;
}, () => true);
function selectPosting(id) {
  Object.assign(view, { current: id, opened: null, match: null, picked: null, showCalc: false, showReference: false, reasons: new Set() });
  load('posting', () => api.posting(id), () => view.current === id);
}
function toggleResume(rid) {
  const open = view.opened !== rid;
  Object.assign(view, { opened: open ? rid : null, match: null, picked: null, showCalc: false, showReference: false, reasons: new Set() });
  if (open) load('match', () => api.resumeMatch(rid), () => view.opened === rid);
  else render();
}

function conditionIndex(p) {
  const index = {};
  for (const g of Object.keys(p.conditions)) for (const c of p.conditions[g]) index[c.item_id] = { ...c, group: g };
  return index;
}

function renderTabs() {
  const tabs = el('div', { class: 'tabs', role: 'tablist', 'aria-label': '공고' });
  for (const p of view.postings) tabs.append(el('button', { class: 'tab', role: 'tab', 'aria-selected': String(p.posting_id === view.current),
    on: { click: () => selectPosting(p.posting_id) } }, p.title));
  return tabs;
}

function renderHero(p) {
  const header = el('header', { class: 'hero' }, el('h1', { class: 'display-2' }, p.job));
  if (p.duties.length) {
    const duties = el('ul', { class: 'duties', 'aria-label': '담당업무' }, el('li', { class: 'label-s tertiary' }, '담당업무'));
    for (const d of p.duties) duties.append(el('li', { class: 'chip' }, d.text));
    header.append(duties);
  }
  return header;
}

function conditionGroup(name, items, note, excluded) {
  const list = el('ul');
  if (!items.length) list.append(el('li', { class: 'plain tertiary' }, '공고에 없어요'));
  for (const it of items) {
    const text = el('span', it.in_reading === false ? { class: 'secondary' } : {}, it.text);
    if (it.in_reading === false) text.append(el('span', { class: 'body-3 tertiary' }, '  공고에서 확인하지 못했어요'));
    list.append(el('li', {}, el('span', { class: 'no' }, it.no), text));
  }
  return el('div', { class: 'condition-group' + (excluded ? ' excluded' : '') },
    el('div', { class: 'head' }, el('h3', { class: 'title-2' }, name), el('span', { class: 'body-3 tertiary' }, note)), list);
}

function renderConditions(p) {
  const required = p.conditions['자격요건'], preferred = p.conditions['우대사항'];
  const share = (items, other, part) => items.length ? `${items.length}개, 점수의 ${other.length ? part : 100}%` : '점수에 들어가지 않아요';
  return el('section', { class: 'section' },
    el('div', { class: 'section-head' }, el('h2', { class: 'h4' }, '비교한 조건')),
    el('div', { class: 'conditions' },
      conditionGroup('자격요건', required, share(required, preferred, 70)),
      conditionGroup('우대사항', preferred, share(preferred, required, 30)),
      conditionGroup('참고사항', p.conditions['참고사항'], '보여 주기만 하고 점수에 넣지 않아요', true)),
    el('p', { class: 'body-3 tertiary section-note' }, '점수는 이 공고가 적은 조건을 이력서에서 확인한 정도예요. 같은 공고의 지원자끼리만 비교해요.'));
}

function renderLegend() {
  const list = el('ul');
  for (const [mark, meaning] of LEGEND) list.append(el('li', {}, el('span', {}, badge(mark)), el('span', { class: 'body-3 secondary' }, meaning)));
  return el('div', { class: 'card legend' }, list);
}

function renderVerdicts(p, r) {
  const index = conditionIndex(p);
  const box = el('div', { class: 'verdicts' });
  for (const g of SCORED) {
    const marks = r.verdicts.filter(v => index[v.item_id] && index[v.item_id].group === g);
    if (!marks.length) continue;
    const group = el('div', { class: 'verdict-group' }, el('span', { class: 'body-3 tertiary' }, g));
    for (const v of marks) {
      const c = index[v.item_id];
      const b = badge(v.mark, '');
      b.append(el('span', { class: 'no' }, c.no), SHORT[v.mark]);
      b.title = `${c.text}: ${v.mark}`;
      group.append(b);
    }
    box.append(group);
  }
  return box;
}

function renderRanking(p) {
  const section = el('section', { class: 'section' },
    el('div', { class: 'section-head' }, el('h2', { class: 'h4' }, p.ranking.length ? `지원자 ${p.ranking.length}명의 랭킹` : '랭킹'),
      p.ranking.length ? toggle('showLegend', '판정 표시 설명 보기', '판정 표시 설명 접기') : null));
  if (!p.ranking.length) { section.append(el('div', { class: 'card state' }, el('p', { class: 'title-2' }, '비교한 이력서가 아직 없어요'), el('p', { class: 'secondary' }, '이력서를 넣고 다시 실행하면 여기에 랭킹이 나와요.'))); return section; }
  if (view.showLegend) section.append(renderLegend());
  const board = el('ul', { class: 'board' });
  for (const r of p.ranking) {
    const open = view.opened === r.resume_id;
    const head = el('div', { class: 'row-head', 'aria-expanded': String(open), 'aria-label': `${r.rank}위 ${r.resume_id}, ${r.score}점. 근거 ${open ? '접기' : '보기'}` },
      el('span', { class: 'rank' + (r.rank === 1 ? ' first' : '') }, String(r.rank)),
      el('span', { class: 'title-2' }, r.resume_id),
      renderVerdicts(p, r),
      el('div', { class: 'score-box' }, el('span', { class: 'score' }, String(r.score)), el('div', { class: 'progress', 'aria-hidden': 'true' }, el('span', { style: `width:${r.score}%` }))),
      el('span', { class: 'button-secondary', 'aria-hidden': 'true' }, open ? '접기' : '근거 보기'));
    const li = el('li', { class: 'board-row' + (open ? ' open' : '') }, pressable(head, () => toggleResume(r.resume_id)));
    if (open) li.append(renderDetail(p));
    board.append(li);
  }
  section.append(board);
  return section;
}

function renderDetail(p) {
  const m = view.match;
  if (m === 'loading' || m === null) return loading();
  if (m instanceof Error) return failed(() => { const rid = view.opened; view.opened = null; toggleResume(rid); });
  return el('div', { class: 'detail' }, el('div', {}, renderCalc(m), ...renderEvidence(p, m)), renderResume(m));
}

function renderCalc(m) {
  const r = m.required, q = m.preferred;
  const part = (name, g) => g ? `${name} ${g.count}개 중 ${g.matched}개 일치` : null;
  const frac = g => `(${g.points}/${g.full})`;
  const formula = r && q ? `70 × ${frac(r)} + 30 × ${frac(q)} = ${m.score}` : `100 × ${frac(r || q)} = ${m.score}`;
  const note = r && q ? '자격요건이 70, 우대사항이 30이에요. 판정마다 일치 2점, 비슷 1점, 다름 0점으로 세요.'
    : `${r ? '우대사항' : '자격요건'}이 없는 공고라 ${r ? '자격요건' : '우대사항'}이 100이에요. 판정마다 일치 2점, 비슷 1점, 다름 0점으로 세요.`;
  const box = el('div', { class: 'calc' }, el('span', { class: 'title-2' }, [part('자격요건', r), part('우대사항', q)].filter(Boolean).join(', ')),
    toggle('showCalc', '점수 계산 보기', '점수 계산 접기'));
  if (view.showCalc) box.append(el('div', { class: 'formula' }, el('p', { class: 'title-2 tnum' }, formula), el('p', { class: 'body-3 secondary' }, note)));
  return box;
}

function renderEvidenceItem(index, j) {
  const c = index[j.item_id] || { no: '', text: '' };
  const body = el('div', { class: 'evidence-body' });
  for (const q of j.quotes) {
    if (j.quotes_in_resume) {
      const pressed = view.picked === j.item_id;
      body.append(el('button', { class: 'quote-block', 'aria-pressed': String(pressed), 'aria-label': `${c.no} 근거를 이력서에서 보기`,
        on: { click: () => { view.picked = pressed ? null : j.item_id; render(); } } }, q,
        el('span', { class: 'quote-hint label-s' }, pressed ? '이력서에 표시했어요' : '이력서에서 보기')));
    } else body.append(el('div', { class: 'quote-block plain' }, q));
  }
  if (j.thinking) {
    const shown = view.reasons.has(j.item_id);
    body.append(el('button', { class: 'text-button', 'aria-expanded': String(shown), on: { click: () => { shown ? view.reasons.delete(j.item_id) : view.reasons.add(j.item_id); render(); } } },
      shown ? '판정한 이유 접기' : '판정한 이유 보기'));
    if (shown) body.append(el('p', { class: 'reason body-3' }, j.thinking));
  }
  return el('li', { class: 'evidence-item' },
    el('div', { class: 'top' }, el('span', { class: 'no' }, c.no), el('span', { class: 'text' }, c.text), badge(j.mark)), body);
}

function renderEvidence(p, m) {
  const index = conditionIndex(p);
  const group = g => {
    const rows = m.judgments.filter(j => j.group === g);
    if (!rows.length) return null;
    const list = el('ul');
    for (const j of rows) list.append(renderEvidenceItem(index, j));
    return el('div', { class: 'evidence-group' }, el('div', { class: 'head' }, el('h3', { class: 'label-s tertiary' }, g)), list);
  };
  const out = SCORED.map(group).filter(Boolean);
  if (m.judgments.some(j => j.group === '참고사항')) {
    out.push(el('div', { style: 'margin-top:24px' }, toggle('showReference', '참고사항의 판정 보기', '참고사항의 판정 접기')));
    if (view.showReference) out.push(group('참고사항'));
  }
  return out;
}

function findRanges(text, quotes) {
  const skip = /[\s#*`\-]/;
  let squeezed = '';
  const at = [];
  for (let i = 0; i < text.length; i++) if (!skip.test(text[i])) { squeezed += text[i]; at.push(i); }
  const ranges = [];
  for (const q of quotes) {
    const needle = [...q].filter(c => !skip.test(c)).join('');
    const found = needle ? squeezed.indexOf(needle) : -1;
    if (found >= 0) ranges.push([at[found], at[found + needle.length - 1] + 1]);
  }
  return ranges.sort((a, b) => a[0] - b[0]);
}
function renderResume(m) {
  const pre = el('pre', { class: 'resume', tabindex: '0', 'aria-label': '이력서 원문' });
  const j = m.judgments.find(x => x.item_id === view.picked);
  let pos = 0;
  for (const [start, end] of j ? findRanges(m.resume_text, j.quotes) : []) {
    if (start < pos) continue;
    pre.append(m.resume_text.slice(pos, start), el('mark', { class: 'quote-highlight ' + (HIGHLIGHT[j.mark] || 'hl-different') }, m.resume_text.slice(start, end)));
    pos = end;
  }
  pre.append(m.resume_text.slice(pos));
  const hint = j ? el('p', { class: 'body-3 secondary' }, badge(j.mark), ' 판정의 근거를 표시했어요.') : el('p', { class: 'body-3 tertiary' }, '왼쪽에서 근거를 누르면 여기에 표시해요.');
  return el('div', { class: 'resume-pane' }, el('h3', { class: 'title-2' }, '이력서 원문'), hint, pre);
}

function render() {
  const app = document.getElementById('app');
  const focusKey = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('aria-label');
  app.replaceChildren();
  if (view.postings === 'loading' || view.postings === null) { app.append(loading()); return; }
  if (view.postings instanceof Error) { app.append(failed(loadPostings)); return; }
  if (!view.postings.length) {
    app.append(el('div', { class: 'card state' }, el('p', { class: 'title-2' }, '넘겨받은 공고가 아직 없어요'), el('p', { class: 'secondary' }, '공고를 수집하는 프로그램의 실행 로그에서 이유를 볼 수 있어요.')));
    return;
  }
  app.append(renderTabs());
  const p = view.posting;
  if (p === 'loading' || p === null) app.append(loading());
  else if (p instanceof Error) app.append(failed(() => selectPosting(view.current)));
  else app.append(renderHero(p), renderConditions(p), renderRanking(p));
  if (focusKey) { const again = [...app.querySelectorAll('[aria-label]')].find(n => n.getAttribute('aria-label') === focusKey); if (again) again.focus({ preventScroll: true }); }
  const hit = app.querySelector('.quote-highlight');
  if (hit) { const box = hit.closest('.resume'); box.scrollTop = Math.max(0, hit.offsetTop - box.offsetTop - 48); }
}
loadPostings();
</script>
</body>
</html>
